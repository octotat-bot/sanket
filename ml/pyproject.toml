[project]
name = "sanket"
version = "0.0.1"
description = "Real-time Indian Sign Language (ISL) word recognition: training and data pipeline"
requires-python = "==3.12.*"
# Runtime deps used by data prep and export. Every version is pinned exactly.
dependencies = [
    "numpy==2.5.5",
    "mediapipe==1.2.3",          # MUST equal @mediapipe/tasks-vision in web/package.json (tested)
    "onnx==1.23.2",
    "onnxruntime==1.32.0",
    # Video decoding. mediapipe already depends on it; pinned explicitly so the decoder
    # version can't drift silently under a mediapipe bump (approved 2026-11-24).
    "opencv-contrib-python==5.1.0.95",
    "pyyaml==6.0.4",               # one YAML config per experiment
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
]
# Heavy training deps live in their own group so CI and preprocessing
# environments don't download a multi-GB CUDA torch wheel.
train = [
    "torch==2.15.0",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanket"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Report generators build long Markdown table rows in f-strings.
"src/sanket/checks/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["mediapipe.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: test needs internet access (deselect with -m 'not network')",
]
